name: Nginx - Widen /masjid/:id regex to match slugs

# Manual-only. The proxy rule added by nginx-add-share-routes.yml only
# matched numeric ids (^/masjid/[0-9]+$) — masjid URLs are now slugs
# (lowercase letters/digits/hyphens, per utils/slugify.js), so that rule
# needs widening or it silently stops proxying these requests to the
# backend (falls through to serving the static, generic SPA shell again —
# the original bug this was built to fix). Uses plain Python string
# .replace() (no regex, no escaping ambiguity) on a literal line it knows
# exactly from the config this same pipeline wrote. Backs up the file,
# validates with nginx -t before ever reloading, restores + fails without
# reloading if that check doesn't pass. sudo confirmed passwordless via
# nginx-diag.yml when nginx-add-share-routes.yml first ran.
on:
  workflow_dispatch: {}

jobs:
  patch-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Write remote patch script
        run: |
          cat > remote_patch.py <<'PYEOF'
          import subprocess, sys, datetime
          CONF = "/etc/nginx/sites-available/masjidmycommunity"
          OLD = "location ~ ^/masjid/[0-9]+$ {"
          NEW = "location ~ ^/masjid/[a-z0-9-]+$ {"
          content = subprocess.run(["sudo", "cat", CONF], capture_output=True, text=True, check=True).stdout
          if NEW in content:
              print("Already widened -- no changes made.")
              sys.exit(0)
          if OLD not in content:
              print("ERROR: expected rule not found -- aborting without changes.")
              sys.exit(1)
          backup = f"{CONF}.bak-{datetime.datetime.now():%Y%m%d%H%M%S}"
          subprocess.run(["sudo", "cp", CONF, backup], check=True)
          print(f"Backed up current config to {backup}")
          new_content = content.replace(OLD, NEW)
          with open("/tmp/masjidmycommunity.new", "w") as f:
              f.write(new_content)
          subprocess.run(["sudo", "cp", "/tmp/masjidmycommunity.new", CONF], check=True)
          print("Widened the regex.")
          test = subprocess.run(["sudo", "nginx", "-t"], capture_output=True, text=True)
          print(test.stdout, test.stderr)
          if test.returncode == 0:
              subprocess.run(["sudo", "systemctl", "reload", "nginx"], check=True)
              print("Reloaded successfully.")
          else:
              print("SYNTAX ERROR -- restoring backup, NOT reloading.")
              subprocess.run(["sudo", "cp", backup, CONF], check=True)
              sys.exit(1)
          PYEOF

      - name: Run patch over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key remote_patch.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            python3 /tmp/remote_patch.py && rm -f /tmp/remote_patch.py /tmp/masjidmycommunity.new
          '
