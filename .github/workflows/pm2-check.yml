name: PM2 mode check (read-only)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check pm2 process status and recent logs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            echo "===== pm2 describe ====="
            pm2 describe masjidmycommunity-api
            echo "===== error log tail ====="
            tail -n 200 ~/.pm2/logs/masjidmycommunity-api-error.log
            echo "===== out log tail ====="
            tail -n 40 ~/.pm2/logs/masjidmycommunity-api-out.log
            echo "===== node version ====="
            node -v
            echo "===== package.json start script ====="
            cat /var/www/masjidmycommunity/server/package.json | grep -A3 "\"scripts\""
          '
