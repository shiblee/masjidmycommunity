name: PM2 mode check (read-only diagnosis, briefly stops/restarts pm2 to avoid a port race)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run server directly to capture the real crash output
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            cd /var/www/masjidmycommunity/server
            pm2 stop masjidmycommunity-api
            sleep 1
            echo "===== running node src/server.js directly for 8s ====="
            node src/server.js > /tmp/direct_run.log 2>&1 &
            SPID=$!
            sleep 8
            kill -0 $SPID 2>/dev/null && echo "STILL ALIVE after 8s" || echo "PROCESS DIED within 8s"
            kill $SPID 2>/dev/null
            sleep 1
            echo "===== captured output ====="
            cat /tmp/direct_run.log
            echo "===== restarting pm2 ====="
            pm2 start masjidmycommunity-api
          '
