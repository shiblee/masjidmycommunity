name: PM2 mode check (read-only)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Memory and process check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            echo "===== free -h ====="
            free -h
            echo "===== dmesg oom (last 30 matching lines) ====="
            sudo dmesg 2>/dev/null | grep -i "out of memory\|oom" | tail -30
            echo "===== journalctl kernel oom ====="
            sudo journalctl -k --since "-10 min" 2>/dev/null | grep -i "oom\|killed process" | tail -30
          '
