name: Nginx Inspect (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print current nginx config over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            echo "===== nginx -T (effective config) ====="
            sudo nginx -T 2>&1 || nginx -T 2>&1 || echo "nginx -T failed"
            echo "===== sites-enabled listing ====="
            ls -la /etc/nginx/sites-enabled/ 2>&1
            echo "===== sites-available listing ====="
            ls -la /etc/nginx/sites-available/ 2>&1
          '
