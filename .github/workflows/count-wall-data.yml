name: Count wall data (read-only)

# Read-only reconnaissance — runs server/scripts/countWallData.mjs on the
# server, which only SELECTs, never writes. Used to size a possible wall
# data wipe before doing anything destructive.
on:
  workflow_dispatch: {}

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Run the read-only count script on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /var/www/masjidmycommunity/server
            node scripts/countWallData.mjs
          '
